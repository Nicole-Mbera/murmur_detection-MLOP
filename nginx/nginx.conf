events {}

http {
  # "api" resolves to every API container. nginx reads the addresses when it starts,
  # so restart the gateway after changing the number of API containers (scripts/scale.sh does this).
  upstream api_pool {
    server api:8000;
    keepalive 32;
  }

  log_format lb '$remote_addr [$time_local] "$request" $status $request_time upstream=$upstream_addr';
  access_log /var/log/nginx/access.log lb;

  server {
    listen 80;
    client_max_body_size 400m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
      proxy_pass http://api_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
