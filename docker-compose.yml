name: heart-murmur

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      MODELS_DIR: /app/models
      DATA_DIR: /app/data
      RETRAIN_AUTO_THRESHOLD: "50"
      TF_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      # shared by every API container: model files, state.json, uploaded data
      - ./models:/app/models
      - ./data:/app/data
    expose:
      - "8000"
    mem_limit: 2g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://gateway
      DATA_DIR: /app/data
      ASSETS_DIR: /app/assets
      DEMO_DIR: /app/data/test
    volumes:
      - ./data:/app/data:ro
      - ./ui/assets:/app/assets:ro
    ports:
      - "8501:8501"
    depends_on:
      - gateway
    restart: unless-stopped

  locust:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: Dockerfile.locust
    environment:
      DEMO_DIR: /demo
    volumes:
      - ./locust:/locust:ro
      - ./data/test:/demo:ro
      - ./results:/results
    depends_on:
      - gateway
